[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lung-ct-pseudogroup-classification"
version = "1.0.0"
description = "Paper-aligned pseudo-group context-aware lung CT classification"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "Pillow>=10.0",
  "scikit-learn>=1.3",
  "torch>=2.1",
  "torchvision>=0.16",
]

[project.scripts]
lung-ct-classification = "classification.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

